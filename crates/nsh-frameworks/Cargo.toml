[package]
name = "nsh-frameworks"
description = "Link prebuilt Apple frameworks (XCFrameworks) from nshm crates and embed the dynamic ones into Native Shell (NSH) app packages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["nsh", "nshm", "xcframework", "ios", "macos"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[features]
# The `nsh-frameworks` command. A build script depends on the library alone:
# `nsh-frameworks = { git = "...", default-features = false }`.
default = ["cli"]
cli = ["dep:clap", "dep:serde_json"]

[[bin]]
name = "nsh-frameworks"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1"
plist = "1.7"
toml = "0.8"
clap = { version = "4.5", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
